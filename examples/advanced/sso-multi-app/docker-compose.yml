    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin&directConnection=true}
      - MONGODB_DB=${MONGODB_DB:-oblivio_apps}
      - MDB_ENGINE_MASTER_KEY=${MDB_ENGINE_MASTER_KEY:-}
      # SECURITY: MDB_ENGINE_JWT_SECRET must be set via environment variable for production
      # For local development only, a default is provided (INSECURE - DO NOT USE IN PRODUCTION!)
      # Generate a strong secret: python -c 'import secrets; print(secrets.token_urlsafe(32))'
      # Production: Set MDB_ENGINE_JWT_SECRET in your environment before running docker-compose
      - MDB_ENGINE_JWT_SECRET=${MDB_ENGINE_JWT_SECRET:-oblivio_jwt_secret_change_in_production_xyz789}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - oblivio_network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # AI Chat - ChitChat Clone with SSO (with CSFLE Memory Encryption)
  ai-chat:
    build:
      context: ../../..
      dockerfile: examples/advanced/sso-multi-app/Dockerfile
      args:
        APP_USER: appuser
        APP_UID: 1000
        APP_GID: 1000
    container_name: ai_chat
    restart: unless-stopped
    # Use entrypoint for automatic CSFLE key management
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-u", "apps/sso-app-3/web.py"]
    ports:
      - "${AI_CHAT_PORT:-8003}:8000"
    env_file:
      - ./apps/sso-app-3/.env
    environment:
      # MongoDB - support both naming conventions
      - MONGO_URI=${MONGO_URI:-${MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin&directConnection=true}}
      - MONGODB_URI=${MONGODB_URI:-${MONGO_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin&directConnection=true}}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-${MONGODB_DB:-oblivio_apps}}
      - MONGODB_DB=${MONGODB_DB:-${MONGO_DB_NAME:-oblivio_apps}}
      # MDB Engine
      - MDB_ENGINE_MASTER_KEY=${MDB_ENGINE_MASTER_KEY:-}
      # SECURITY: MDB_ENGINE_JWT_SECRET must be set via environment variable for production
      # For local development only, a default is provided (INSECURE - DO NOT USE IN PRODUCTION!)
      # Generate a strong secret: python -c 'import secrets; print(secrets.token_urlsafe(32))'
      # Production: Set MDB_ENGINE_JWT_SECRET in your environment before running docker-compose
      - MDB_ENGINE_JWT_SECRET=${MDB_ENGINE_JWT_SECRET:-oblivio_jwt_secret_change_in_production_xyz789}
      # Auth Hub
      - AUTH_HUB_URL=${AUTH_HUB_URL:-http://auth-hub:8000}
      # CSFLE (Client-Side Field Level Encryption)
      # Key is loaded from ./apps/sso-app-3/.env (MDB_CSFLE_LOCAL_KEY)
      # Or override via host environment variable
      - CSFLE_ENABLED=true
      - CRYPT_SHARED_LIB_PATH=/opt/mongodb/lib/mongo_crypt_v1.so
      # NOTE: MDB_CSFLE_LOCAL_KEY is intentionally NOT set here to allow .env file to take precedence
      # SECURITY: For production, use AWS KMS, Azure Key Vault, or GCP Cloud KMS instead
      # Azure OpenAI - loaded from .env file (env_file directive above)
      # These will be automatically loaded from ./apps/sso-app-3/.env
      # To override, export them in your shell before running docker-compose
      # Other
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist CSFLE key across container restarts
      - csfle_keys:/data/csfle
    depends_on:
      mongodb:
        condition: service_healthy
      auth-hub:
        condition: service_started
    networks:
      - oblivio_network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Member - Cognitive Memory Showcase (Member Berries)
  member:
    build:
      context: ../../..
      dockerfile: examples/advanced/sso-multi-app/Dockerfile
      args:
        APP_USER: appuser
        APP_UID: 1000
        APP_GID: 1000
    container_name: member_app
    restart: unless-stopped
