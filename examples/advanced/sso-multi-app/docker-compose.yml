# ============================================================================
# Docker Compose Configuration for SSO Multi-App
# Single container running all apps via create_multi_app()
# ============================================================================

services:
  # MongoDB Atlas Local
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: oblivio_apps_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGODB_INITDB_DATABASE: ${MONGODB_INITDB_DATABASE:-oblivio_apps}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - oblivio_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh "mongodb://localhost:27017/?directConnection=true" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Restore sample_mflix into MongoDB (one-shot, idempotent)
  # Requires: ./download-sample-dataset.sh has been run first
  restore-sample-mflix:
    image: mongo:8.0
    container_name: restore_sample_mflix
    entrypoint: ["bash", "-c"]
    command:
      - |
        ARCHIVE="/data/sampledata.archive"
        URI="mongodb://mongodb:27017/?directConnection=true"
        if [ ! -f "$$ARCHIVE" ]; then
          echo ""
          echo "ERROR: sampledata.archive not found."
          echo ""
          echo "  Run this first:  ./download-sample-dataset.sh"
          echo "  Then retry:      docker-compose up"
          echo ""
          exit 1
        fi
        echo "Waiting for MongoDB..."
        until mongosh "$$URI" --quiet --eval 'db.runCommand("ping").ok' 2>/dev/null; do sleep 2; done
        COUNT=$$(mongosh "$$URI" --quiet --eval 'db.getSiblingDB("sample_mflix").movies.countDocuments()' 2>/dev/null || echo 0)
        if [ "$$COUNT" -gt 100 ]; then
          echo "sample_mflix already loaded ($$COUNT movies) — skipping."
          exit 0
        fi
        echo "Restoring sample_mflix from archive..."
        mongorestore --uri="$$URI" --archive="$$ARCHIVE" --drop --nsInclude="sample_mflix.*"
        echo "Done. sample_mflix restored."
    volumes:
      - ./sampledata.archive:/data/sampledata.archive:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - oblivio_network
    restart: "no"

  # SSO Multi-App -- all apps in one process via create_multi_app()
  # Apps mounted at: /auth-hub, /pwd-zero, /flux, /member
  sso-platform:
    build:
      context: ../../..
      dockerfile: examples/advanced/sso-multi-app/Dockerfile
      args:
        APP_USER: appuser
        APP_UID: 1000
        APP_GID: 1000
    container_name: sso_platform
    restart: unless-stopped
    command: >
      sh -c "
      echo '=== Starting SSO Multi-App Platform ===' 1>&2;
      cd /app/apps && exec uvicorn multi_app_main:app --host 0.0.0.0 --port 8000 2>&1
      "
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - MDB_MONGO_URI=${MDB_MONGO_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin&directConnection=true}
      - MDB_DB_NAME=${MDB_DB_NAME:-oblivio_apps}
      - MDB_ENGINE_MASTER_KEY=${MDB_ENGINE_MASTER_KEY:-}
      # SECURITY: MDB_JWT_SECRET must be set via environment variable for production
      # For local development only, a default is provided (INSECURE - DO NOT USE IN PRODUCTION!)
      # Generate a strong secret: python -c 'import secrets; print(secrets.token_urlsafe(32))'
      - MDB_JWT_SECRET=${MDB_JWT_SECRET:-oblivio_jwt_secret_change_in_production_xyz789}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongodb:
        condition: service_healthy
      restore-sample-mflix:
        condition: service_completed_successfully
    networks:
      - oblivio_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  oblivio_network:
    driver: bridge
    name: oblivio_apps_network
