{% extends "base.html" %}

{% block title %}Perceptions | orby{% endblock %}

{% block extra_css %}
<style>
    .perceptions-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .perceptions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
        margin-bottom: 30px;
    }

    .perception-card {
        background: radial-gradient(circle at center, rgba(26, 27, 47, 0.88) 0%, rgba(26, 27, 47, 0.75) 100%);
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 40px var(--glow-color) inset;
    }

    .card-title {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(135deg, #fff 0%, rgba(138, 43, 226, 0.8) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 20px;
    }

    .attribute-item {
        margin-bottom: 20px;
    }

    .attribute-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
    }

    .attribute-name {
        text-transform: capitalize;
    }

    .attribute-value {
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
    }

    .gauge-container {
        height: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
    }

    .gauge-fill {
        height: 100%;
        background: linear-gradient(90deg, rgba(138, 43, 226, 0.8) 0%, rgba(138, 43, 226, 0.4) 100%);
        transition: width 0.5s ease;
        border-radius: 6px;
    }

    .justification {
        margin-top: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.6;
    }

    .stats-section {
        margin-top: 30px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item:last-child {
        border-bottom: none;
    }

    .stat-label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
    }

    .stat-value {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
        font-size: 14px;
    }

    .timeline-section {
        margin-top: 30px;
    }

    .timeline-card {
        background: radial-gradient(circle at center, rgba(26, 27, 47, 0.88) 0%, rgba(26, 27, 47, 0.75) 100%);
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 40px var(--glow-color) inset;
    }

    .timeline-item {
        padding: 15px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        border-left: 3px solid rgba(138, 43, 226, 0.8);
    }

    .timeline-date {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 8px;
    }

    .timeline-content {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: rgba(255, 255, 255, 0.6);
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255, 255, 255, 0.6);
    }

    .empty-state-icon {
        font-size: 64px;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="perceptions-container">
    <div class="perceptions-grid">
        <!-- User Perception Card -->
        <div class="perception-card">
            <h2 class="card-title">User Perception</h2>
            <div id="user-perception-content">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Self Perception Card -->
        <div class="perception-card">
            <h2 class="card-title">Self Perception</h2>
            <div id="self-perception-content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="perception-card">
        <h2 class="card-title">Statistics</h2>
        <div id="stats-content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <!-- Timeline Section -->
    <div class="timeline-section">
        <div class="timeline-card">
            <h2 class="card-title">Perception History</h2>
            <div id="timeline-content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
</div>

<script>
async function loadPerceptions() {
    await Promise.all([
        loadUserPerception(),
        loadSelfPerception(),
        loadStats(),
        loadTimeline()
    ]);
}

async function loadUserPerception() {
    try {
        const response = await fetch('/api/perceptions/user');
        const data = await response.json();
        
        const content = document.getElementById('user-perception-content');
        
        if (data.success && data.perception) {
            renderPerception(content, data.perception);
        } else {
            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">👤</div>
                    <div>No user perception data yet. Start a conversation to build perceptions.</div>
                </div>
            `;
        }
    } catch (error) {
        console.error('Failed to load user perception:', error);
        document.getElementById('user-perception-content').innerHTML = 
            '<div class="loading">Failed to load user perception.</div>';
    }
}

async function loadSelfPerception() {
    try {
        const response = await fetch('/api/perceptions/self');
        const data = await response.json();
        
        const content = document.getElementById('self-perception-content');
        
        if (data.success && data.perception) {
            renderPerception(content, data.perception);
        } else {
            content.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🤖</div>
                    <div>No self-perception data yet. Start a conversation to build perceptions.</div>
                </div>
            `;
        }
    } catch (error) {
        console.error('Failed to load self-perception:', error);
        document.getElementById('self-perception-content').innerHTML = 
            '<div class="loading">Failed to load self-perception.</div>';
    }
}

function renderPerception(container, perception) {
    const attributes = perception.attributes || {};
    let html = '';
    
    // Render attributes
    for (const [key, value] of Object.entries(attributes)) {
        if (typeof value === 'number') {
            const percentage = Math.round(value * 100);
            html += `
                <div class="attribute-item">
                    <div class="attribute-label">
                        <span class="attribute-name">${escapeHtml(key.replace(/_/g, ' '))}</span>
                        <span class="attribute-value">${percentage}%</span>
                    </div>
                    <div class="gauge-container">
                        <div class="gauge-fill" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        } else {
            html += `
                <div class="attribute-item">
                    <div class="attribute-label">
                        <span class="attribute-name">${escapeHtml(key.replace(/_/g, ' '))}</span>
                        <span class="attribute-value">${escapeHtml(String(value))}</span>
                    </div>
                </div>
            `;
        }
    }
    
    // Add justification if available
    if (perception.justification) {
        html += `
            <div class="justification">
                <strong>Justification:</strong><br>
                ${escapeHtml(perception.justification)}
            </div>
        `;
    }
    
    // Add stats
    if (perception.interaction_count !== undefined || perception.last_updated) {
        html += '<div class="stats-section">';
        if (perception.interaction_count !== undefined) {
            html += `
                <div class="stat-item">
                    <span class="stat-label">Interactions</span>
                    <span class="stat-value">${perception.interaction_count}</span>
                </div>
            `;
        }
        if (perception.last_updated) {
            const date = new Date(perception.last_updated);
            html += `
                <div class="stat-item">
                    <span class="stat-label">Last Updated</span>
                    <span class="stat-value">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</span>
                </div>
            `;
        }
        html += '</div>';
    }
    
    container.innerHTML = html;
}

async function loadStats() {
    try {
        const response = await fetch('/api/perceptions/stats');
        const data = await response.json();
        
        const content = document.getElementById('stats-content');
        
        if (data.success && data.stats) {
            const stats = data.stats;
            let html = '<div class="stats-section">';
            
            if (stats.user_interaction_count !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">User Interactions</span>
                        <span class="stat-value">${stats.user_interaction_count}</span>
                    </div>
                `;
            }
            
            if (stats.self_interaction_count !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">System Interactions</span>
                        <span class="stat-value">${stats.self_interaction_count}</span>
                    </div>
                `;
            }
            
            html += '</div>';
            content.innerHTML = html;
        } else {
            content.innerHTML = '<div class="empty-state">No statistics available.</div>';
        }
    } catch (error) {
        console.error('Failed to load stats:', error);
        document.getElementById('stats-content').innerHTML = 
            '<div class="loading">Failed to load statistics.</div>';
    }
}

async function loadTimeline() {
    try {
        const response = await fetch('/api/perceptions/history?limit=20');
        const data = await response.json();
        
        const content = document.getElementById('timeline-content');
        
        if (data.success && data.history && data.history.length > 0) {
            let html = '';
            for (const item of data.history) {
                const date = new Date(item.last_updated || item.created_at);
                html += `
                    <div class="timeline-item">
                        <div class="timeline-date">${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
                        <div class="timeline-content">
                            <strong>${item.perception_type === 'user_view' ? 'User' : 'Self'} Perception:</strong><br>
                            ${item.justification || 'No justification provided'}
                        </div>
                    </div>
                `;
            }
            content.innerHTML = html;
        } else {
            content.innerHTML = '<div class="empty-state">No perception history available.</div>';
        }
    } catch (error) {
        console.error('Failed to load timeline:', error);
        document.getElementById('timeline-content').innerHTML = 
            '<div class="loading">Failed to load timeline.</div>';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Load perceptions on page load
loadPerceptions();
</script>
{% endblock %}
