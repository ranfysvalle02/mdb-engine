# ---------------------------------------------------------------------------
# Family Nexus -- OSI Semantic Model
# ---------------------------------------------------------------------------
# A comprehensive family management model for an AI household assistant.
# Tracks family members, health records, medications, allergies,
# vaccinations, appointments, routines, meal plans, emergency contacts,
# pets, grocery lists, chores, homework, budgets, and device locations.
#
# 17 datasets  |  22 relationships  |  11 metrics  |  600+ synonyms
#
# Loaded by mdb-engine via osi_config.models_path in manifest.json.
# ---------------------------------------------------------------------------

semantic_model:
  - name: family_management
    description: >
      Comprehensive family management model for an AI household assistant.
      Tracks family members, health records, medications, allergies,
      vaccinations, appointments, routines, meal plans, emergency contacts,
      pets, grocery lists, chores, homework, budgets, and device locations.
    ai_context:
      synonyms:
        - family database
        - household
        - home management
        - family organizer
        - family planner
        - family nexus
        - home assistant
        - family hub

    # -----------------------------------------------------------------------
    # DATASETS
    # -----------------------------------------------------------------------
    datasets:

      # --- Core: Family Members -------------------------------------------
      - name: family_member
        source: mdb_engine.ai_chat.family_member
        primary_key: [member_id]
        fields:
          - name: member_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: name
            ai_context:
              synonyms: [name, full name, first name, who]
          - name: role
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: role
            ai_context:
              synonyms: [family role, position, title, relationship role]
          - name: birthday
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: birthday
            dimension:
              is_time: true
            ai_context:
              synonyms: [date of birth, DOB, born, birth date, age]
          - name: phone
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: phone
            ai_context:
              synonyms: [phone number, cell, mobile, telephone, contact number]
          - name: email
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: email
            ai_context:
              synonyms: [email address, e-mail]
          - name: blood_type
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: blood_type
            ai_context:
              synonyms: [blood group, type, blood]
          - name: insurance_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: insurance_id
            ai_context:
              synonyms: [insurance number, policy number, member ID, insurance card]
          - name: primary_doctor
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: primary_doctor
            ai_context:
              synonyms: [PCP, family doctor, general practitioner, GP, physician, pediatrician]
          - name: school
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: school
            ai_context:
              synonyms: [school name, attends, enrolled, grade school, daycare, preschool]
          - name: grade
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: grade
            ai_context:
              synonyms: [class, year, grade level]
          - name: employer
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: employer
            ai_context:
              synonyms: [workplace, works at, company, job, occupation]
          - name: dietary_preferences
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: dietary_preferences
            ai_context:
              synonyms: [diet, vegetarian, vegan, gluten-free, kosher, halal, food preferences, eating habits]
          - name: notes
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: notes
            ai_context:
              synonyms: [additional info, comments, details]
        ai_context:
          synonyms:
            - family
            - person
            - member
            - kid
            - parent
            - spouse
            - child
            - relative
            - son
            - daughter
            - husband
            - wife
            - brother
            - sister
            - grandparent
            - baby
            - toddler
            - teen
            - teenager

