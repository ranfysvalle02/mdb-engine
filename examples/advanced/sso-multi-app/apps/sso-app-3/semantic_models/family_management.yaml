    # -----------------------------------------------------------------------
    # METRICS
    # -----------------------------------------------------------------------
    metrics:

      # --- Existing Metrics ---

      - name: active_medications
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(medication.medication_id) WHERE medication.end_date IS NULL"
        description: Total number of currently active medications across all family members
        ai_context:
          synonyms:
            - how many medications
            - current meds
            - active prescriptions
            - what meds is everyone on
            - medication count

      - name: upcoming_appointments
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(appointment.appointment_id) WHERE appointment.date BETWEEN NOW() AND NOW() + INTERVAL 7 DAY"
        description: Number of appointments scheduled in the next 7 days
        ai_context:
          synonyms:
            - "what's coming up"
            - next appointments
            - "this week's appointments"
            - upcoming schedule
            - "what's on the calendar"

      - name: high_severity_allergies
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(allergy.allergy_id) WHERE allergy.severity IN ('high', 'severe', 'life-threatening')"
        description: Count of high-severity or life-threatening allergies across all members
        ai_context:
          synonyms:
            - dangerous allergies
            - severe allergies
            - life-threatening allergies
            - critical allergies
            - allergy warnings

      - name: overdue_vaccinations
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(vaccination.vaccination_id) WHERE vaccination.next_due < NOW()"
        description: Vaccinations that are past their scheduled next dose date
        ai_context:
          synonyms:
            - missed vaccines
            - overdue shots
            - expired vaccinations
            - vaccines due
            - need to get vaccinated

      - name: weekly_routine_count
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(routine.routine_id) WHERE routine.frequency = 'weekly'"
        description: Total number of weekly routines and chores
        ai_context:
          synonyms:
            - how many chores
            - weekly tasks
            - routine count
            - chore list
            - things to do this week

      - name: meals_planned
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(meal_plan.meal_id)"
        description: Total number of meals currently in the meal plan
        ai_context:
          synonyms:
            - how many meals planned
            - meal count
            - menu items
            - "what's planned for meals"
            - dinner plan

      # =====================================================================
      # NEW METRICS -- Family Nexus Extensions
      # =====================================================================

      - name: grocery_items_pending
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(grocery_item.item_id) WHERE grocery_item.status = 'pending'"
        description: Number of items still on the grocery list that have not been purchased
        ai_context:
          synonyms:
            - how many groceries
            - shopping list count
            - items to buy
            - what do we still need
            - grocery list size
            - how long is the list

      - name: overdue_homework
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(homework.homework_id) WHERE homework.due_date < NOW() AND homework.status != 'completed'"
        description: Homework assignments past their due date that have not been completed
        ai_context:
          synonyms:
            - late homework
            - missing assignments
            - overdue schoolwork
            - incomplete homework
            - what homework is late

      - name: chores_completed_this_week
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(chore.chore_id) WHERE chore.status = 'completed' AND chore.completed_at BETWEEN NOW() - INTERVAL 7 DAY AND NOW()"
        description: Number of chores completed in the last 7 days
        ai_context:
          synonyms:
            - chores done this week
            - completed tasks
            - how many chores done
            - weekly chore progress
            - task completion rate

      - name: monthly_budget_total
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "SUM(budget_entry.amount) WHERE budget_entry.entry_type = 'expense' AND budget_entry.date BETWEEN DATE_TRUNC('month', NOW()) AND NOW()"
        description: Total expenses for the current month
        ai_context:
          synonyms:
            - how much spent this month
            - monthly spending
            - monthly expenses
            - budget total
            - this month's costs

      - name: family_members_at_home
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "COUNT(DISTINCT device_location.member_id) WHERE device_location.location = 'home'"
        description: Number of family members currently at home based on last known location
        ai_context:
          synonyms:
            - who is home
            - "who's at home"
            - how many people home
            - anyone home
            - is everyone home
