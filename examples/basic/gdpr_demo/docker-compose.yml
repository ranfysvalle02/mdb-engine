version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gdpr_demo_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gdpr_demo_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdpr_demo_app
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MDB_MONGO_URI: mongodb://mongodb:27017/
      MDB_DB_NAME: gdpr_demo_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/app
    command: python web.py

volumes:
  mongodb_data:
