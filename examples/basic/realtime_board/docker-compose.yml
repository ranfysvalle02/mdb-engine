services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./manifest.json:/app/manifest.json
    environment:
      - MONGODB_URI=mongodb://mongo:27017/?directConnection=true
      - MDB_DB_NAME=mdb_engine
      - _MDB_SERVE_MANIFEST=/app/manifest.json
    command: >
      bash -c "pip install mdb-engine uvicorn -q &&
               uvicorn mdb_engine.cli._serve_app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
